name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure shellcheck is installed
        run: command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
      - name: Run tests (contract, syntax, shellcheck)
        run: bash tests/run.sh

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests (contract, syntax; bash 3.2 from /bin/bash)
        run: bash tests/run.sh
